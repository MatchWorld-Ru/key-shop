<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кастомный сайт клиента</title>
    <style>
        :root {
            --main-bg: #ffffff;
            --main-text: #222222;
            --accent-color: #d4af37; /* Золотой по умолчанию */
        }

        body {
            background-color: var(--main-bg);
            color: var(--main-text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            transition: background 0.3s, color 0.3s;
        }

        header {
            padding: 40px 20px;
            text-align: center;
            border-bottom: 2px solid var(--accent-color);
        }

        h1, h2, p {
            outline: none;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: rgba(0,0,0,0.03);
            border: 1px solid var(--accent-color);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        /* Кнопка-шестеренка в углу */
        #gear-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            z-index: 10000;
            transition: transform 0.2s, background 0.3s;
        }

        #gear-btn:hover {
            transform: scale(1.1);
        }

        /* Выдвижной GUI редактора */
        #builder-gui {
            position: fixed;
            bottom: 100px;
            right: 25px;
            width: 320px;
            background: #181818;
            color: #fff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            display: none;
            z-index: 10000;
            font-size: 14px;
        }

        #builder-gui h3 {
            margin-top: 0;
            color: var(--accent-color);
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        #builder-gui label {
            display: block;
            margin-top: 12px;
            color: #bbb;
        }

        #builder-gui input, #builder-gui select {
            width: 100%;
            margin-top: 6px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #252525;
            color: #fff;
            box-sizing: border-box;
        }

        .hint {
            font-size: 12px;
            color: #888;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1 contenteditable="true">Сайт твоего клиента</h1>
        <p contenteditable="true">Кликай на любой текст на странице, чтобы изменить его прямо на лету!</p>
    </header>

    <div class="container">
        <div class="card">
            <h2 contenteditable="true">Блок с информацией</h2>
            <p contenteditable="true">Здесь можно писать всё что угодно, менять цвета через шестеренку в правом нижнем углу и кастомизировать дизайн под себя.</p>
        </div>
    </div>

    <!-- Шестеренка -->
    <button id="gear-btn">⚙️</button>

    <!-- GUI настройки -->
    <div id="builder-gui">
        <h3>Панель дизайнера</h3>
        
        <label>Цвет фона:</label>
        <input type="color" id="bg-color-picker" value="#ffffff">

        <label>Цвет акцента (Золото / Любой):</label>
        <input type="color" id="accent-color-picker" value="#d4af37">

        <label>Цвет текста:</label>
        <input type="color" id="text-color-picker" value="#222222">

        <div class="hint">Все изменения применяются мгновенно!</div>
    </div>

    <script>
        const gearBtn = document.getElementById('gear-btn');
        const gui = document.getElementById('builder-gui');
        const root = document.documentElement;

        // Открытие/закрытие панели по клику на шестеренку
        gearBtn.addEventListener('click', () => {
            gui.style.display = gui.style.display === 'block' ? 'none' : 'block';
        });

        // Управление цветами
        document.getElementById('bg-color-picker').addEventListener('input', (e) => {
            root.style.setProperty('--main-bg', e.target.value);
        });

        document.getElementById('accent-color-picker').addEventListener('input', (e) => {
            const val = e.target.value;
            root.style.setProperty('--accent-color', val);
            gearBtn.style.background = val;
        });

        document.getElementById('text-color-picker').addEventListener('input', (e) => {
            root.style.setProperty('--main-text', e.target.value);
        });
    </script>
</body>
</html>
