<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA | Esports Team</title>
    <style>
        :root {
            --bg-color: #0b0614;
            --panel-bg: rgba(18, 10, 32, 0.85);
            --neon-purple: #a855f7;
            --neon-glow: rgba(168, 85, 247, 0.4);
            --text-main: #ffffff;
            --text-muted: #b4b4b4;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 20%, #2e1065 0%, var(--bg-color) 70%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 3rem;
            letter-spacing: 4px;
            background: linear-gradient(45deg, #ffffff, var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px var(--neon-glow);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--panel-bg);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(168, 85, 247, 0.1);
            backdrop-filter: blur(10px);
        }

        .hidden {
            display: none !important;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
            color: var(--neon-purple);
            border-bottom: 1px solid rgba(168, 85, 247, 0.2);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: rgba(10, 5, 20, 0.8);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--neon-purple);
            box-shadow: 0 0 10px var(--neon-glow);
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #7c3aed, #9333ea);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(124, 58, 237, 0.4);
            margin-top: 10px;
        }

        button:hover {
            background: linear-gradient(135deg, #8b5cf6, #a855f7);
            box-shadow: 0 0 25px var(--neon-glow);
        }

        .social-btn {
            background: #ffffff;
            color: #0b0614;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .social-btn:hover {
            background: #e2e8f0;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .status-pending { background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid #facc15; }
        .status-approved { background: rgba(34, 197, 94, 0.2); color: var(--success); border: 1px solid var(--success); }
        .status-rejected { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }

        .admin-card {
            background: rgba(15, 5, 25, 0.9);
            border: 1px solid rgba(168, 85, 247, 0.4);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .admin-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-approve { background: var(--success); box-shadow: 0 0 10px rgba(34, 197, 94, 0.4); }
        .btn-reject { background: var(--danger); box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }

        .toggle-link {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            color: var(--text-muted);
            cursor: pointer;
        }
        .toggle-link span {
            color: var(--neon-purple);
            text-decoration: underline;
        }

        .user-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(168, 85, 247, 0.1);
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 4px 10px;
            font-size: 0.8rem;
            width: auto;
            margin: 0;
            box-shadow: none;
        }
        .logout-btn:hover {
            background: var(--danger);
            color: white;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }
    </style>
</head>
<body>

    <header>
        <h1>NEXORA</h1>
        <p>CS2 Esports Team Platform</p>
    </header>

    <div class="container">

        <!-- СЕКЦИЯ АВТОРИЗАЦИИ -->
        <div id="auth-section">
            <h2>Вход в систему</h2>
            
            <!-- Вход по телефону -->
            <div id="phone-login-form">
                <div class="form-group">
                    <label>Номер телефона</label>
                    <input type="text" id="phone-input" placeholder="+7 (777) 000-00-00">
                </div>
                <button onclick="sendCode()">Получить код</button>
            </div>

            <!-- Подтверждение кода -->
            <div id="code-verify-form" class="hidden">
                <div class="form-group">
                    <label>Введите код из СМС (любые 4 цифры)</label>
                    <input type="text" id="code-input" placeholder="1234" maxlength="4">
                </div>
                <button onclick="verifyCode()">Войти</button>
            </div>

            <div style="text-align: center; margin: 15px 0; color: var(--text-muted);">или</div>

            <button class="social-btn" onclick="googleLogin()">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.95H1.2v3.15C3.18 21.31 7.27 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.25c-.25-.72-.38-1.49-.38-2.25s.13-1.53.38-2.25V6.6H1.2C.44 8.14 0 9.89 0 12s.44 3.86 1.2 5.4l4.08-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.27 0 3.18 2.69 1.2 6.6l4.08 3.15c.95-2.84 3.6-4.95 6.72-4.95z"/></svg>
                Войти через Google
            </button>

            <div class="toggle-link" onclick="toggleAdminMode()">Вход для администратора</div>
        </div>

        <!-- ОКНО ВХОДА АДМИНА -->
        <div id="admin-login-section" class="hidden">
            <h2>Вход для Администратора</h2>
            <div class="form-group">
                <label>Секретный ключ админа</label>
                <input type="password" id="admin-key-input" placeholder="Введите ключ">
            </div>
            <button onclick="loginAdmin()">Войти в панель</button>
            <div class="toggle-link" onclick="toggleAdminMode()">Назад к авторизации игрока</div>
        </div>

        <!-- ЛИЧНЫЙ КАБИНЕТ ИГРОКА -->
        <div id="player-cabinet" class="hidden">
            <div class="user-info-bar">
                <span id="user-identifier">Игрок</span>
                <button class="logout-btn" onclick="logout()">Выйти</button>
            </div>

            <h2>Заявка в команду</h2>
            
            <div id="application-form-area">
                <div class="form-group">
                    <label>Ваш игровой ник (Nickname)</label>
                    <input type="text" id="app-nickname" placeholder="например, s1mple">
                </div>
                <div class="form-group">
                    <label>Ваша роль</label>
                    <select id="app-role">
                        <option value="Fragger / Entry">Fragger / Entry</option>
                        <option value="AWP">AWP</option>
                        <option value="Support">Support</option>
                        <option value="IGL (Капитан)">IGL (Капитан)</option>
                        <option value="Lurker">Lurker</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Ссылка на FACEIT / Steam</label>
                    <input type="text" id="app-link" placeholder="https://faceit.com/ru/players/...">
                </div>
                <div class="form-group">
                    <label>О себе / Опыт игры</label>
                    заполните коротко ваш прайм-тайм и достижения
                    <textarea id="app-about" rows="3" placeholder="Уровень игры, часы в CS2..."></textarea>
                </div>
                <button onclick="submitApplication()">Отправить заявку</button>
            </div>

            <div id="application-status-area" class="hidden" style="text-align: center; padding: 20px;">
                <p style="margin-bottom: 10px; color: var(--text-muted);">Статус вашей заявки:</p>
                <div id="status-badge-container"></div>
                <p id="status-message" style="margin-top: 15px; font-size: 0.9rem; color: var(--text-muted);"></p>
            </div>
        </div>

        <!-- ПАНЕЛЬ АДМИНИСТРАТОРА -->
        <div id="admin-panel" class="hidden">
            <div class="user-info-bar">
                <span>Панель Администратора</span>
                <button class="logout-btn" onclick="logout()">Выйти</button>
            </div>
            <h2>Заявки игроков</h2>
            <div id="admin-applications-list">
                <!-- Сюда динамически выводятся заявки -->
            </div>
        </div>

    </div>

    <script>
        // Секретный ключ админа, запрошенный тобой
        const ADMIN_SECRET_KEY = "NEXORA-ADMIN-2026";

        // Проверка локального хранилища при загрузке
        window.onload = function() {
            checkSession();
        };

        function getStoredData() {
            let apps = JSON.parse(localStorage.getItem('nexora_apps')) || [];
            return apps;
        }

        function saveStoredData(apps) {
            localStorage.setItem('nexora_apps', JSON.stringify(apps));
        }

        // Авторизация по телефону (Имитация)
        let tempPhone = "";
        function sendCode() {
            const phone = document.getElementById('phone-input').value;
            if(!phone || phone.length < 5) {
                alert('Введите корректный номер телефона!');
                return;
            }
            tempPhone = phone;
            document.getElementById('phone-login-form').classList.add('hidden');
            document.getElementById('code-verify-form').classList.remove('hidden');
            alert('СМС-код отправлен! (Для теста введите любые 4 цифры)');
        }

        function verifyCode() {
            const code = document.getElementById('code-input').value;
            if(code.length !== 4) {
                alert('Введите 4-значный код!');
                return;
            }
            loginUser(tempPhone);
        }

        // Вход через Google (Имитация реального процесса)
        function googleLogin() {
            const simulatedEmail = "player_" + Math.floor(Math.random() * 8999 + 1000) + "@gmail.com";
            loginUser(simulatedEmail);
        }

        function loginUser(identifier) {
            localStorage.setItem('nexora_current_user', identifier);
            localStorage.setItem('nexora_role', 'player');
            checkSession();
        }

        // Переключение на форму админа
        function toggleAdminMode() {
            document.getElementById('auth-section').classList.toggle('hidden');
            document.getElementById('admin-login-section').classList.toggle('hidden');
        }

        function loginAdmin() {
            const key = document.getElementById('admin-key-input').value;
            if(key === ADMIN_SECRET_KEY) {
                localStorage.setItem('nexora_role', 'admin');
                checkSession();
            } else {
                alert('Неверный секретный ключ админа!');
            }
        }

        function logout() {
            localStorage.removeItem('nexora_current_user');
            localStorage.removeItem('nexora_role');
            location.reload();
        }

        function checkSession() {
            const role = localStorage.getItem('nexora_role');
            const currentUser = localStorage.getItem('nexora_current_user');

            // Скрываем все разделы
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('admin-login-section').classList.add('hidden');
            document.getElementById('player-cabinet').classList.add('hidden');
            document.getElementById('admin-panel').classList.add('hidden');

            if(role === 'admin') {
                document.getElementById('admin-panel').classList.remove('hidden');
                renderAdminApplications();
            } else if(role === 'player' && currentUser) {
                document.getElementById('player-cabinet').classList.remove('hidden');
                document.getElementById('user-identifier').innerText = currentUser;
                checkUserApplication(currentUser);
            } else {
                document.getElementById('auth-section').classList.remove('hidden');
            }
        }

        // Работа с заявками игроков
        function submitApplication() {
            const nickname = document.getElementById('app-nickname').value;
            const role = document.getElementById('app-role').value;
            const link = document.getElementById('app-link').value;
            const about = document.getElementById('app-about').value;
            const user = localStorage.getItem('nexora_current_user');

            if(!nickname || !link) {
                alert('Заполните ник и ссылку на профиль!');
                return;
            }

            let apps = getStoredData();
            // Удаляем старую заявку пользователя, если он отправляет новую
            apps = apps.filter(app => app.user !== user);

            apps.push({
                user: user,
                nickname: nickname,
                role: role,
                link: link,
                about: about,
                status: 'pending' // pending, approved, rejected
            });

            saveStoredData(apps);
            checkUserApplication(user);
            alert('Заявка успешно отправлена на рассмотрение!');
        }

        function checkUserApplication(user) {
            const apps = getStoredData();
            const userApp = apps.find(app => app.user === user);

            const formArea = document.getElementById('application-form-area');
            const statusArea = document.getElementById('application-status-area');
            const badgeContainer = document.getElementById('status-badge-container');
            const statusMessage = document.getElementById('status-message');

            if(userApp) {
                formArea.classList.add('hidden');
                statusArea.classList.remove('hidden');

                if(userApp.status === 'pending') {
                    badgeContainer.innerHTML = `<span class="status-badge status-pending">На рассмотрении</span>`;
                    statusMessage.innerText = "Администраторы скоро проверят вашу анкету.";
                } else if(userApp.status === 'approved') {
                    badgeContainer.innerHTML = `<span class="status-badge status-approved">Одобрена</span>`;
                    statusMessage.innerText = "Поздравляем! Ваша заявка одобрена. Свяжитесь с нами для зачисления в состав.";
                } else if(userApp.status === 'rejected') {
                    badgeContainer.innerHTML = `<span class="status-badge status-rejected">Отклонена</span>`;
                    statusMessage.innerText = "К сожалению, ваша заявка была отклонена.";
                }
            } else {
                formArea.classList.remove('hidden');
                statusArea.classList.add('hidden');
            }
        }

        // Панель админа: рендер заявок
        function renderAdminApplications() {
            const apps = getStoredData();
            const listContainer = document.getElementById('admin-applications-list');
            listContainer.innerHTML = '';

            if(apps.length === 0) {
                listContainer.innerHTML = `<p style="color: var(--text-muted); text-align: center;">Пока нет поданных заявок.</p>`;
                return;
            }

            apps.forEach((app, index) => {
                let statusText = `<span class="status-badge status-pending">На рассмотрении</span>`;
                if(app.status === 'approved') statusText = `<span class="status-badge status-approved">Одобрена</span>`;
                if(app.status === 'rejected') statusText = `<span class="status-badge status-rejected">Отклонена</span>`;

                const card = document.createElement('div');
                card.className = 'admin-card';
                card.innerHTML = `
                    <p><strong>Игрок (Логин):</strong> ${app.user}</p>
                    <p><strong>Ник:</strong> ${app.nickname}</p>
                    <p><strong>Роль:</strong> ${app.role}</p>
                    <p><strong>Профиль:</strong> <a href="${app.link}" target="_blank" style="color: var(--neon-purple);">${app.link}</a></p>
                    <p><strong>О себе:</strong> ${app.about || 'Не указано'}</p>
                    <p style="margin-top: 8px;"><strong>Статус:</strong> ${statusText}</p>
                    <div class="admin-actions">
                        <button class="btn-approve" onclick="updateAppStatus(${index}, 'approved')">Одобрить</button>
                        <button class="btn-reject" onclick="updateAppStatus(${index}, 'rejected')">Отклонить</button>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        function updateAppStatus(index, status) {
            let apps = getStoredData();
            apps[index].status = status;
            saveStoredData(apps);
            renderAdminApplications();
        }
    </script>
</body>
</html>
