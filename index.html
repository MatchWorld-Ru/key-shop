<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniMart — Глобальный маркетплейс мира</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #00C853;
            --dark-green: #004D20;
            --light-green: #E8F5E9;
            --bg-color: #F4F6F5;
            --card-bg: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border-color: #E5E7EB;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* Шапка сайта */
        header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
            animation: slideDown 0.6s ease-out;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--dark-green);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
        }

        .logo svg {
            width: 30px;
            height: 30px;
            fill: var(--primary-green);
        }

        .logo span {
            color: var(--primary-green);
        }

        .search-bar {
            flex: 1;
            max-width: 550px;
            margin: 0 40px;
            display: flex;
            background: var(--bg-color);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            transition: var(--transition);
        }

        .search-bar:focus-within {
            border-color: var(--primary-green);
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(0, 200, 83, 0.1);
        }

        .search-bar input {
            flex: 1;
            padding: 12px 20px;
            border: none;
            background: transparent;
            outline: none;
            font-size: 15px;
            color: var(--text-main);
        }

        .search-bar button {
            background: var(--primary-green);
            border: none;
            color: white;
            padding: 0 25px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .search-bar button:hover {
            background: var(--dark-green);
        }

        .nav-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .nav-btn {
            background: transparent;
            border: 2px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-main);
            text-decoration: none;
            font-size: 14px;
        }

        .nav-btn.primary {
            background: var(--primary-green);
            border-color: var(--primary-green);
            color: white;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            border-color: var(--primary-green);
        }

        /* Главный контент */
        main {
            margin-top: 100px;
            padding: 40px 30px;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Hero баннер */
        .hero {
            background: linear-gradient(135deg, var(--dark-green) 0%, var(--primary-green) 100%);
            border-radius: 28px;
            padding: 60px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 77, 32, 0.15);
            animation: fadeIn 0.8s ease-out;
        }

        .hero-content {
            max-width: 600px;
            z-index: 2;
        }

        .hero h1 {
            font-size: 46px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .hero p {
            font-size: 17px;
            opacity: 0.9;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 18px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .cta-btn {
            background: white;
            color: var(--dark-green);
            padding: 16px 32px;
            border-radius: 14px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .cta-btn:hover {
            transform: translateY(-3px);
            background: var(--light-green);
            box-shadow: 0 15px 25px rgba(0,0,0,0.15);
        }

        .hero-visual {
            width: 380px;
            height: 280px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: float 4s ease-in-out infinite;
        }

        .hero-visual svg {
            width: 120px;
            height: 120px;
            fill: white;
            opacity: 0.9;
        }

        /* Анимации */
        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Футер */
        footer {
            background: #111827;
            color: white;
            text-align: center;
            padding: 40px;
            margin-top: 150px;
            font-size: 14px;
            color: #9CA3AF;
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header>
        <div class="nav-container">
            <a href="#" class="logo">
                <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                Omni<span>Mart</span>
            </a>
            <div class="search-bar">
                <input type="text" placeholder="Искать товары по всему миру...">
                <button>Найти</button>
            </div>
            <div class="nav-actions">
                <button class="nav-btn">Войти</button>
                <button class="nav-btn primary">Стать продавцом</button>
            </div>
        </div>
    </header>

    <!-- Основной контент -->
    <main>
        <!-- Баннер -->
        <section class="hero">
            <div class="hero-content">
                <div class="hero-badge">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    Глобальный маркетплейс нового поколения
                </div>
                <h1>Покупай и продавай по всему миру без границ</h1>
                <p>OmniMart объединяет миллионы товаров, надежную логистику и мгновенные расчеты в единую экологичную экосистему.</p>
                <button class="cta-btn">Исследовать каталог</button>
            </div>
            <div class="hero-visual">
                <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16zM3.27 6.96L12 12.01l8.73-5.05M12 22.08V12"/></svg>
            </div>
        </section>
    </main>

    <!-- Футер -->
    <footer>
        <p>&copy; 2026 OmniMart Global. Все права защищены. Создаем маркетплейс будущего.</p>
    </footer>

</body>
</html>
